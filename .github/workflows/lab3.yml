name: Kubernetes Lab

on: [push, pull_request]

jobs:
  k8s-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build Docker image inside Minikube
        run: |
          eval $(minikube docker-env)
          docker build -t ecommerce-app:latest .

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for Postgres to be ready
        run: kubectl rollout status deployment/postgres --timeout=60s

      - name: Wait for app to be ready
        run: kubectl rollout status deployment/ecommerce-app --timeout=90s

      - name: Run Master Validation Script
        run: |
          chmod +x ./tests/lab3_test.sh
          ./tests/lab3_test.sh
